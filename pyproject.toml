[project]
name = "runtrainer"
version = "0.1.0"
description = "SuperTrainer：Garmin 数据 + 丹尼尔斯训练法课表 + DeepSeek AI 教练"
requires-python = ">=3.12"
dependencies = [
    "pywebview>=5.0",
    "garminconnect>=0.2.24",
    "fitparse>=1.2.0",
    "openai>=1.50",
    "pydantic>=2.7",
    "keyring>=25.0",
    "tzlocal>=5.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runtrainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
